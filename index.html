<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <title>Conversor de Moedas</title>
</head>
<body>
  <main class="container">
    <h1 class="page-title">Conversor de Moedas</h1>
    <p class="page-subtitle">Converta entre Real, Dólar, Euro e Bitcoin com taxa atualizada.</p>
    <img src="assents/acslogo.png" alt="Logo do conversor" class="page-logo" />

    <form id="converter-form" class="form">
      <div class="form-field">
        <label for="source-currency">Valor em</label>
        <select class="select" id="source-currency" name="source-currency">
          <option value="BRL">Real (BRL)</option>
          <option value="USD">Dólar (USD)</option>
          <option value="EUR">Euro (EUR)</option>
          <option value="BTC">Bitcoin (BTC)</option>
        </select>
      </div>

      <div class="form-field">
        <label for="amount">Valor</label>
        <input type="number" id="amount" name="amount" min="0" step="0.00000001" placeholder="Ex: 100.50" required />
      </div>

      <div class="form-field">
        <label for="target-currency">Converter para</label>
        <select class="select" id="target-currency" name="target-currency">
          <option value="BRL">Real (BRL)</option>
          <option value="USD">Dólar (USD)</option>
          <option value="EUR">Euro (EUR)</option>
          <option value="BTC">Bitcoin (BTC)</option>
        </select>
      </div>

      <button id="convert-button" type="submit">Converter</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <output id="converted-value" class="result" aria-live="polite"></output>

    <section class="comparison-section" aria-live="polite">
      <div class="comparison-header">
        <h2 class="comparison-title">Micro comparações de preço</h2>
        <button id="export-button" type="button" class="secondary-button" disabled>Exportar CSV</button>
      </div>
      <div class="table-wrapper">
        <table class="comparison-table">
          <thead>
            <tr>
              <th>Moeda</th>
              <th>Valor convertido</th>
            </tr>
          </thead>
          <tbody id="comparison-table-body">
            <tr>
              <td colspan="2">Faça uma conversão para gerar a tabela.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
